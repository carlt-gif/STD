<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Our Date!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #fdfaf6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .card-container {
            position: relative;
            width: 360px;
            height: 520px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
        }
        .reveal-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            background: #ffffff;
        }
        h1 { color: #d4af37; font-size: 2rem; margin-bottom: 5px; }
        p { color: #555; font-size: 1.1rem; line-height: 1.5; }
        .date { font-size: 1.8rem; font-weight: bold; color: #222; margin: 20px 0; }
        .cal-btn {
            padding: 10px 20px;
            background: #d4af37;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .cal-btn:hover { transform: scale(1.05); }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
            z-index: 2;
        }
    </style>
</head>
<body>

<div class="card-container">
    <!-- Underneath Layer (The Actual Details) -->
    <div class="reveal-layer">
        <p>WE ARE GETTING MARRIED</p>
        <h1>Alex & Jordan</h1>
        <p class="date">OCTOBER 10, 2026</p>
        <p>San Francisco, CA</p>
        <a class="cal-btn" href="https://calendar.google.com" target="_blank">Add to Calendar</a>
    </div>

    <!-- Scratch Layer Over the Top -->
    <canvas id="scratchCanvas" width="360" height="520"></canvas>
</div>

<script>
    const canvas = document.getElementById('scratchCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    // Fill the canvas with a solid "scratch-off" layer cover
    ctx.fillStyle = '#bc985a'; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Add overlay text instructions
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Scratch here to reveal', 180, 240);
    ctx.fillText('our secret!', 180, 270);

    function scratch(e) {
        if (!isDrawing) return;
        
        // Handle both desktop mouse and mobile touch inputs
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches.clientX) - rect.left;
        const y = (e.clientY || e.touches.clientY) - rect.top;

        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, 25, 0, Math.PI * 2);
        ctx.fill();
    }

    // Event Listeners for Interaction
    canvas.addEventListener('mousedown', () => isDrawing = true);
    canvas.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('mousemove', scratch);

    canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
    canvas.addEventListener('touchend', () => isDrawing = false);
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); scratch(e); });
</script>

</body>
</html>
